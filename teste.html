<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passar Tempo</title>

    <!-- 1. CSS do PNotify (Core + Tema Bright) -->
    <link href=" https://cdn.jsdelivr.net/npm/@pnotify/core@5.2.0/dist/PNotify.min.css " rel="stylesheet">

        <!-- 2. JS do PNotify Core -->
    <script src=" https://cdn.jsdelivr.net/npm/@pnotify/core@5.2.0/dist/PNotify.min.js "></script>
    <script src="https://cdn.jsdelivr.net/npm/nonblockjs@1/NonBlock.es5.js" type="text/javascript"></script>
</head>
<body>

    <div class="container mt-5">
        <button class="btn btn-primary" onclick="mostrar_alerta()">Show Notice</button>
    </div>

    <script type="text/javascript">
        // Teste automático ao carregar a página
        function mostrar_alerta() {
            PNotify.notice({
        title: 'Non-Blocking Notice',
        text: 'I\'m a special kind of notice called "non-blocking". When you hover over me I\'ll fade to show the elements underneath. Feel free to click any of them just like I wasn\'t even here.\n\nNote: HTML links don\'t trigger in some very old browsers, due to security settings.',
        addModelessClass: 'nonblock'
        });

            PNotify.alert({
                title: 'Página carregada com sucesso!',
                delay: 2000
            });

            PNotify.info({
                title: 'New Thing',
                text: 'Just to let you know, something happened.'
            }); 
        }

        // Função disparada pelo botão
        function showNotification() {
            PNotify.notice({
                title: 'Vanilla JS Notice',
                text: "Hey, funciona sem node_modules!",
                delay: 3000
            });
        }


    </script>
</body>
</html>
